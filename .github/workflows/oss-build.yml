# Community (OSS) build — Node artifact upload + Docker image to GHCR (GitHub Container Registry).

name: OSS build

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

concurrency:
    group: oss-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-oss:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install Node
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: "24"
                  cache: npm

            - name: Copy example config
              run: cp config/config.example.yml config/config.yml

            - name: Install dependencies
              run: npm ci

            - name: SQLite + OSS build targets
              run: |
                  npm run set:sqlite
                  npm run set:oss

            - name: Generate DB client (drizzle)
              run: npm run db:generate

            - name: Build (Next + server bundles)
              run: npm run build

            - name: Remove Next cache from artifact
              run: rm -rf .next/cache

            - name: Upload OSS build artifact
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: pangolin-oss-${{ github.sha }}
                  path: |
                      dist/
                      .next/
                  retention-days: 30

    # Pushes to ghcr.io/<owner>/<repo> — same Dockerfile as local `make dev-build-sqlite`.
    # Fork PRs: build only (no push). Same-repo PRs + pushes + workflow_dispatch: build and push.
    docker-oss:
        runs-on: ubuntu-latest
        env:
            REGISTRY: ghcr.io
            # Preserves case; docker/metadata-action lowercases image refs for tags
            IMAGE_NAME: ${{ github.repository }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=sha-
                      type=ref,event=branch
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

            - name: Set OCI created timestamp
              id: timestamp
              run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      BUILD=oss
                      DATABASE=sqlite
                      VERSION=${{ github.sha }}
                      REVISION=${{ github.sha }}
                      CREATED=${{ steps.timestamp.outputs.iso }}
                      IMAGE_TITLE=Pangolin
                      IMAGE_DESCRIPTION=Identity-aware VPN and proxy for remote access to anything, anywhere